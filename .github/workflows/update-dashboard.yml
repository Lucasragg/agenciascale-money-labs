name: Atualizar e publicar dashboard

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [dashboard_refresh]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cruzar planilhas e gerar dados
        run: python scripts/build_data.py
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Empacotar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4

  deploy_retry:
    needs: [build, deploy]
    if: ${{ always() && needs.build.result == 'success' && needs.deploy.result != 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Aguardar liberação do Pages
        run: sleep 120
      - name: Republicar
        id: deployment
        uses: actions/deploy-pages@v4

  deploy_retry_2:
    needs: [build, deploy, deploy_retry]
    if: ${{ always() && needs.build.result == 'success' && needs.deploy.result != 'success' && needs.deploy_retry.result != 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Aguardar nova liberação do Pages
        run: sleep 120
      - name: Republicar novamente
        id: deployment
        uses: actions/deploy-pages@v4
