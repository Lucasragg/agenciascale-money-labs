name: Atualizar e publicar dashboard

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [dashboard_refresh]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url || steps.deployment_retry_2.outputs.page_url }}
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cruzar planilhas e gerar dados
        run: python scripts/build_data.py
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Empacotar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publicar — tentativa 1
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Aguardar liberação do Pages
        if: ${{ steps.deployment.outcome == 'failure' }}
        run: sleep 120
      - name: Publicar — tentativa 2
        id: deployment_retry
        if: ${{ steps.deployment.outcome == 'failure' }}
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Aguardar nova liberação do Pages
        if: ${{ steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure' }}
        run: sleep 120
      - name: Publicar — tentativa 3
        id: deployment_retry_2
        if: ${{ steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure' }}
        uses: actions/deploy-pages@v4
